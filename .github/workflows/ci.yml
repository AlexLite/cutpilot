name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python tests
        run: |
          python -m unittest discover -q
          python -m compileall -q app tests
      - name: Shell checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n deploy/cutpilot-watcher
          shellcheck deploy/cutpilot-watcher
      - name: Docker build
        run: docker build --tag cutpilot:ci .
