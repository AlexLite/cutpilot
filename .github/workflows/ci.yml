name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python tests
        run: |
          python -m unittest discover -q
          python -m compileall -q app tests
      - name: Shell checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg shellcheck
          sudo install -D -m 0755 deploy/cutpilot-probe.py /usr/local/libexec/cutpilot-probe
          bash -n deploy/cutpilot-watcher
          bash -n tests/integration_watcher.sh
          shellcheck --severity=error deploy/cutpilot-watcher
          shellcheck --severity=error tests/integration_watcher.sh
      - name: FFmpeg watcher integration
        run: bash tests/integration_watcher.sh
      - name: Docker build
        run: docker build --tag cutpilot:ci .
